<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f7">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Matteo Barresi — Digital Business Card</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="page">

    <!-- INTESTAZIONE -->
    <header class="intro">
      <p class="intro-eyebrow">ING Bank · Financial Advisor</p>
      <h1 class="intro-title">Il mio biglietto da visita</h1>
      <p class="intro-text">Aggiungilo al wallet del tuo telefono o scaricalo come immagine: i miei contatti restano sempre a portata di mano.</p>
    </header>

    <!-- BIGLIETTO -->
    <img
      class="business-card"
      src="business-card.png"
      alt="Biglietto da visita digitale di Matteo Barresi"
    >

    <!-- WALLET -->
    <p class="wallet-label" id="walletLabel">Aggiungi al wallet</p>

    <section class="wallet-row" aria-labelledby="walletLabel">

      <a class="wallet-link" id="appleWallet" href="#" aria-label="Aggiungi ad Apple Wallet">
        <img class="wallet-image" src="apple-wallet.svg" alt="Add to Apple Wallet">
      </a>

      <a class="wallet-link" id="googleWallet" href="#" aria-label="Aggiungi a Google Wallet">
        <img class="wallet-image" src="google-wallet.svg" alt="Add to Google Wallet">
      </a>

    </section>

    <!-- DOWNLOAD PNG -->
    <a
      class="png-button"
      href="business-card.png"
      download="matteo-barresi-business-card.png"
      aria-label="Scarica il biglietto da visita in formato PNG"
    >
      <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
        <path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 20h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Scarica come immagine</span>
    </a>

    <!-- TORNA INDIETRO -->
    <a class="back-link" href="https://swiy.co/barresi-business-card">
      <svg class="back-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
        <path d="M19 12H5m0 0l6-6m-6 6l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Torna indietro</span>
    </a>

  </main>

  <!-- MANTIENI IL NOME ESATTO DEL TUO FILE JS ATTUALE -->
<script src="wallet-config.js"></script>
  
</body>
</html>

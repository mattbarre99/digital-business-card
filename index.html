<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex,nofollow">
  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <title>Matteo Barresi — Digital Business Card</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="page">

    <!-- BIGLIETTO DA VISITA -->
    <img
      class="business-card"
      src="business-card.png"
      alt="Biglietto da visita digitale di Matteo Barresi"
      width="320"
      height="202"
    >

    <!-- APPLE / GOOGLE WALLET -->
    <section
      class="wallet-row"
      aria-label="Salva nei wallet"
    >

      <!-- APPLE WALLET -->
      <a
        class="wallet-button"
        id="appleWallet"
        href="#"
        aria-label="Aggiungi ad Apple Wallet"
      >

        <svg
          class="wallet-icon"
          viewBox="0 0 32 32"
          aria-hidden="true"
        >
          <rect
            x="3"
            y="5"
            width="26"
            height="22"
            rx="5"
            fill="#252525"
          />

          <path
            d="M6 10h20v4H6z"
            fill="#F4D35E"
          />

          <path
            d="M6 14h20v4H6z"
            fill="#43AA8B"
          />

          <path
            d="M6 18h20v4H6z"
            fill="#4D96FF"
          />

          <rect
            x="21"
            y="12"
            width="7"
            height="9"
            rx="3.5"
            fill="#fff"
          />

          <circle
            cx="23.5"
            cy="16.5"
            r="1"
            fill="#252525"
          />
        </svg>

        <span class="wallet-copy">
          <small>Add to</small>
          <strong>Apple Wallet</strong>
        </span>

      </a>


      <!-- GOOGLE WALLET -->
      <a
        class="wallet-button"
        id="googleWallet"
        href="#"
        aria-label="Aggiungi a Google Wallet"
      >

        <svg
          class="wallet-icon"
          viewBox="0 0 32 32"
          aria-hidden="true"
        >
          <rect
            x="4"
            y="6"
            width="24"
            height="20"
            rx="5"
            fill="#1A73E8"
          />

          <path
            d="M7 9h18v5H7z"
            fill="#EA4335"
          />

          <path
            d="M7 14h18v5H7z"
            fill="#FBBC04"
          />

          <path
            d="M7 19h18v4H7z"
            fill="#34A853"
          />

          <circle
            cx="24"
            cy="17"
            r="4"
            fill="#4285F4"
          />
        </svg>

        <span class="wallet-copy">
          <small>Add to</small>
          <strong>Google Wallet</strong>
        </span>

      </a>

    </section>


    <!-- DOWNLOAD PNG -->
    <a
      class="png-button"
      href="business-card.png"
      download="matteo-barresi-business-card.png"
      aria-label="Scarica il biglietto da visita in formato PNG"
    >
      Download PNG file
    </a>

  </main>


  <script src="wallet-config.js" defer></script>

</body>
</html>

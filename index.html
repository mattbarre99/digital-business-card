<!doctype html>
<html lang="it">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <title>
    Matteo Barresi — Digital Business Card
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>


<body>


  <main class="page">


    <!-- =========================================
         BIGLIETTO DA VISITA
         ========================================= -->

    <img
      class="business-card"
      src="business-card.png"
      alt="Biglietto da visita digitale di Matteo Barresi"
    >


    <!-- =========================================
         PULSANTI WALLET
         ========================================= -->

    <section
      class="wallet-row"
      aria-label="Salva il biglietto nel wallet"
    >


      <!-- APPLE WALLET -->

      <a
        class="wallet-link"
        id="appleWallet"
        href="#"
        aria-label="Aggiungi ad Apple Wallet"
      >

        <img
  class="wallet-image"
  src="apple-wallet.svg"
  alt="Add to Apple Wallet"
      >
          
      </a>


      <!-- GOOGLE WALLET -->

      <a
        class="wallet-link"
        id="googleWallet"
        href="#"
        aria-label="Aggiungi a Google Wallet"
      >

        <img
  class="wallet-image"
  src="google-wallet.svg"
  alt="Add to Apple Wallet"
        >

      </a>


    </section>


    <!-- =========================================
         DOWNLOAD PNG
         ========================================= -->

    <a
      class="png-button"
      href="business-card.png"
      download="matteo-barresi-business-card.png"
      aria-label="Scarica il biglietto da visita in formato PNG"
    >

      Scarica come immagine

    </a>


  </main>


  <script
    src="wallet-config.js"
    defer
  ></script>


</body>

</html>
